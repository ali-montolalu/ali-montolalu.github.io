{{ define "main" }}<h1>{{ .Title }}</h1>{{ .Content }}<ul>{{ $pages := .RegularPagesRecursive }}{{ range $pages.ByDate.Reverse }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ $d := .Date.Format "2006-01-02" }}{{ if and (not .Date.IsZero) (not (strings.Contains .Title $d)) }} <span class="meta">{{ $d }}</span>{{ end }}</li>{{ end }}</ul>{{ end }}
