<!doctype html><html lang="{{ i18n "html_lang" }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(function(d){var t;try{t=localStorage.getItem("theme")}catch(e){}if(t==="light"||t==="dark"){d.setAttribute("data-theme",t);d.setAttribute("data-theme-pref",t)}else{d.setAttribute("data-theme-pref","system")}})(document.documentElement)</script>
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}">{{ end }}
{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}">{{ end }}
<style>:root{color-scheme:light;--bg:#fff;--fg:#222;--muted:#5f6368;--link:#0b5fff;--border:#ddd;--rule:#eee;--th-bg:#eef1f4;--code-bg:#f4f6f8;--quote:#444b55;--quote-bar:#c5ccd6;--toggle-border:#767c86}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#14171c;--fg:#e4e6ea;--muted:#a6adb8;--link:#7fb0ff;--border:#3a414c;--rule:#2a3039;--th-bg:#232933;--code-bg:#1e232b;--quote:#c3c9d2;--quote-bar:#4a5260;--toggle-border:#6e7684}}
:root[data-theme=dark]{color-scheme:dark;--bg:#14171c;--fg:#e4e6ea;--muted:#a6adb8;--link:#7fb0ff;--border:#3a414c;--rule:#2a3039;--th-bg:#232933;--code-bg:#1e232b;--quote:#c3c9d2;--quote-bar:#4a5260;--toggle-border:#6e7684}
html{background:var(--bg)}body{max-width:760px;margin:2rem auto;padding:0 1rem;font:16px/1.7 system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif;color:var(--fg);background:var(--bg)}a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}nav a{margin-right:1rem}header{border-bottom:1px solid var(--rule);padding-bottom:.5rem;margin-bottom:1.5rem}footer{margin-top:3rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--rule);padding-top:.5rem}.meta{color:var(--muted);font-size:.85rem}table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:1rem 0;font-size:.95rem}th,td{border:1px solid var(--border);padding:.45rem .7rem;text-align:left;vertical-align:top}th{background:var(--th-bg);font-weight:600;white-space:nowrap}.hdr-tools{float:right;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;max-width:100%;row-gap:.3rem}.lang{font-size:.9rem;white-space:nowrap}
blockquote{margin:1rem 0;padding:.1rem 1rem;border-left:4px solid var(--quote-bar);color:var(--quote)}code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}code{background:var(--code-bg);padding:.1em .3em;border-radius:3px}pre{background:var(--code-bg);color:var(--fg);padding:.8rem 1rem;overflow-x:auto;border-radius:4px;border:1px solid var(--rule)}pre code{background:none;padding:0}hr{border:0;border-top:1px solid var(--border);margin:1.5rem 0}
.theme-toggle{margin:0 1rem 0 .8rem;white-space:nowrap;font:inherit;font-size:.85rem;line-height:1.4;color:var(--fg);background:transparent;border:1px solid var(--toggle-border);border-radius:4px;padding:.1rem .55rem;cursor:pointer}.theme-toggle:hover{border-color:var(--muted)}.theme-toggle:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px}header{display:flow-root}@media (max-width:480px){.hdr-tools{float:none;justify-content:flex-start;margin-top:.4rem}.theme-toggle{margin-left:0}}</style>
<script src="{{ "js/theme.js" | relURL }}" defer></script>
<script data-goatcounter="https://markjin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body><header><a href="{{ "/" | relLangURL }}"><strong>{{ .Site.Title }}</strong></a> &nbsp; <nav style="display:inline">{{ range .Site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}<a href="{{ "index.xml" | relLangURL }}">RSS</a></nav><span class="hdr-tools"><button type="button" id="theme-toggle" class="theme-toggle" hidden aria-label="{{ i18n "theme_aria_system" }}" title="{{ i18n "theme_aria_system" }}" data-label-system="{{ i18n "theme_system" }}" data-label-light="{{ i18n "theme_light" }}" data-label-dark="{{ i18n "theme_dark" }}" data-aria-system="{{ i18n "theme_aria_system" }}" data-aria-light="{{ i18n "theme_aria_light" }}" data-aria-dark="{{ i18n "theme_aria_dark" }}"><span class="theme-toggle-text">{{ i18n "theme_system" }}</span></button>{{ partial "lang-switch.html" . }}</span></header>
<main>{{ block "main" . }}{{ end }}</main>
<footer>{{ i18n "footer_disclaimer" }}</footer></body></html>
